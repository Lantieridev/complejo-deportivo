name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # Runs the full suite (unit + integration against a real SQL Server via
      # Testcontainers, which needs the Docker daemon already available on
      # ubuntu-latest runners) and enforces the coverage Threshold set in
      # ComplejoDeportivo.Tests.csproj — a coverage regression fails the build.
      - run: dotnet test --no-build --configuration Release
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ComplejoDeportivo.Tests/coverage.json
          retention-days: 14
